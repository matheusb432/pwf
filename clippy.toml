# Fleet clippy tuning — synced from repository `templates/clippy.toml` (edit there, then
# `just repos sync-clippy`; local edits here are overwritten). One root file; Clippy discovers it
# from each crate's manifest dir. It tunes only the *configurable* lints; lint LEVELS (the
# pedantic policy + opt-outs) live in the root Cargo.toml `[workspace.lints.clippy]`. `msrv` is
# intentionally unset — the fleet tracks latest stable, so Clippy is free to suggest the newest
# APIs. Comments sit above keys, never trailing, so a repo's TOML formatter (taplo) can't reflow
# them and fight the sync.
# Internal binaries: let Clippy suggest better signatures freely. Wrong for a repo publishing a
# library crate — grow a which-variant override before opting one in.
avoid-breaking-exported-api = false
