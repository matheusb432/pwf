# Clippy tuning for pwf's crates. One root file; Clippy discovers it from each crate's manifest
# dir. It tunes only the *configurable* lints; lint LEVELS (the pedantic policy + opt-outs) are
# inherited workspace-wide via `[workspace.lints.clippy]` in the root Cargo.toml. These crates are
# internal binaries, never published libraries. `msrv` is intentionally unset — pwf tracks latest
# stable, so Clippy is free to suggest the newest APIs.
avoid-breaking-exported-api = false # internal binaries: let Clippy suggest better signatures freely
allow-unwrap-in-tests = true        # unwrap()/expect() are idiomatic in test bodies
