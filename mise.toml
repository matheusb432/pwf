min_version = "2026.7.18"

[settings]
auto_install = false
lockfile = true
locked = true

[tools]
rust = [
  { version = "1.97.1", profile = "minimal", components = [
    "clippy",
    "rustfmt",
  ] },
  { version = "nightly-2026-06-23", profile = "minimal", components = [
    "rustfmt",
  ] },
]
just = "1.56.0"
rumdl = "0.2.41"
ast-grep = "0.44.1"
"cargo-binstall" = "1.21.1"
"cargo:cargo-llvm-cov" = { version = "0.8.7", depends = [
  "rust",
  "cargo-binstall",
] }

[bootstrap.packages]
"apt:bash" = "latest"
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:git" = "latest"
"apt:openssh-client" = "latest"
"apt:pkg-config" = "latest"
"apt:wget" = "latest"
"apt:zsh" = "latest"

[bootstrap.mise_shell_activate]
zshrc = "activate"

[tasks.bootstrap]
description = "Build and install pwf"
run = "cargo run --quiet -p xtask -- install"
