min_version = "2026.7.18"

[settings]
auto_install = false
lockfile = true
locked = true

[tools]
rust = { version = "1.98.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
] }
just = "1.56.0"
ast-grep = "0.44.1"
buf = "1.72.0"
protoc = "35.1"
"cargo-binstall" = "1.21.1"
"cargo:cargo-llvm-cov" = { version = "0.8.7", depends = [
  "rust",
  "cargo-binstall",
] }
"cargo:cargo-nextest" = { version = "0.9.143", depends = [
  "rust",
  "cargo-binstall",
] }
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = ["rustls", "postgres", "sqlite", "sqlx-toml"], depends = ["rust"] }

[bootstrap.packages]
"apt:bash" = "latest"
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:git" = "latest"
"apt:openssh-client" = "latest"
"apt:pkg-config" = "latest"
"apt:wget" = "latest"
"apt:zsh" = "latest"

[bootstrap.mise_shell_activate]
zshrc = "activate"

[tasks.bootstrap]
description = "Build and install pwf"
run = "cargo run --quiet -p xtask -- install"
