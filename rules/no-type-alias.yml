id: no-type-alias
language: rust
severity: error
message: "Type aliases are banned: spell the type at the use site, or model it as a struct or enum that owns its invariant."
note: |
  An alias is a second name for the same type: it hides the real shape at use
  sites without adding any checking, and readers must chase the alias to learn
  what the code actually handles. Associated types inside an `impl` block are
  required by the trait contract and stay allowed.
rule:
  all:
    - kind: type_item
    - not:
        inside:
          kind: impl_item
          stopBy: end
