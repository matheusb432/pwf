id: no-tty-sniffing-outside-console
language: rust
severity: error
files:
  - "**/*.rs"
ignores:
  - crates/cli/src/console.rs
message: "TTY detection is banned outside the console edge: accept a `console::Console` resolved at the binary edge instead."
note: |
  Interactivity and color sniffed deep in the call stack make in-process callers
  (tests, engine bridges) behave differently depending on how the process was
  launched. `Console::from_terminal()` reads TTY state once in `main`; everything
  below receives the answer explicitly and `Console::plain()` keeps tests
  deterministic.
rule:
  any:
    - pattern: $RECEIVER.is_terminal()
    - kind: identifier
      regex: "^IsTerminal$"
