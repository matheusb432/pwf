# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rust_rule.json

id: no-generic-application-filenames
language: rust
severity: error
files:
  - "crates/application/src/**/handler.rs"
  - "crates/application/src/**/handlers.rs"
  - "crates/application/src/**/helper.rs"
  - "crates/application/src/**/helpers.rs"
  - "crates/application/src/**/manager.rs"
  - "crates/application/src/**/managers.rs"
  - "crates/application/src/**/repo.rs"
  - "crates/application/src/**/repository.rs"
  - "crates/application/src/**/repositories.rs"
  - "crates/application/src/**/service.rs"
  - "crates/application/src/**/services.rs"
  - "crates/application/src/**/util.rs"
  - "crates/application/src/**/utils.rs"
message: "Application source files need a request or responsibility name."
note: "Use the request name, `dto`, `logic`, or a descriptive responsibility name."
rule:
  kind: source_file
