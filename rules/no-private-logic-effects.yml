# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rust_rule.json

id: no-private-logic-effects
language: rust
severity: error
files:
  - "crates/application/src/**/logic.rs"
message: "Application `logic.rs` modules must remain effect-free."
note: "Gather and apply effects in the operation; keep `logic.rs` limited to pure decisions."
rule:
  matches: effect-path
utils:
  effect-path:
    any:
      - matches: effect-use
      - all:
          - any:
              - kind: scoped_identifier
              - kind: scoped_type_identifier
              - kind: use_wildcard
          - regex: "(?s)^(::)?\\s*(std\\s*::\\s*(fs|process|net)(\\s*::\\s*.*)?|std\\s*::\\s*time\\s*::\\s*(SystemTime|Instant)(\\s*::\\s*.*)?|sqlx(\\s*::\\s*.*)?|tokio(\\s*::\\s*.*)?|chrono\\s*::\\s*(Local|Utc)(\\s*::\\s*.*)?|pwf_(application|infra)(\\s*::\\s*.*)?)$"
  effect-use:
    all:
      - kind: use_declaration
      - has:
          field: argument
          any:
            - matches: effect-import-tree
            - all:
                - kind: use_list
                - has:
                    stopBy: neighbor
                    matches: effect-import-tree
  effect-import-tree:
    any:
      - matches: external-effect-tree
      - matches: effect-parent-wildcard
      - matches: capability-root-alias
      - matches: capability-root-alias-group
      - matches: std-effect-parent-alias-group
      - matches: std-effect-tree
      - matches: std-root-group
      - matches: std-time-group
      - matches: chrono-effect-tree
      - matches: chrono-root-group
  capability-root-alias:
    all:
      - kind: use_as_clause
      - regex: "(?s)^(::)?\\s*(std(\\s*::\\s*time)?|chrono|sqlx|tokio|pwf_application|pwf_infra)\\s+as\\s+.*$"
  capability-root-alias-group:
    all:
      - kind: scoped_use_list
      - has:
          field: path
          regex: "(?s)^(::)?\\s*(std(\\s*::\\s*time)?|chrono|sqlx|tokio|pwf_application|pwf_infra)$"
      - has:
          field: list
          all:
            - kind: use_list
            - has:
                stopBy: neighbor
                all:
                  - kind: use_as_clause
                  - regex: "(?s)^self\\s+as\\s+.*$"
  std-effect-parent-alias-group:
    all:
      - kind: scoped_use_list
      - has:
          field: path
          regex: "(?s)^(::)?\\s*std$"
      - has:
          field: list
          all:
            - kind: use_list
            - has:
                stopBy: neighbor
                all:
                  - kind: use_as_clause
                  - regex: "(?s)^time\\s+as\\s+.*$"
  effect-parent-wildcard:
    all:
      - kind: use_wildcard
      - regex: "(?s)^(::)?\\s*(std|std\\s*::\\s*time|chrono)\\s*::\\s*\\*$"
  external-effect-tree:
    all:
      - any:
          - kind: identifier
          - kind: scoped_identifier
          - kind: scoped_type_identifier
          - kind: scoped_use_list
          - kind: use_wildcard
          - kind: use_as_clause
      - regex: "(?s)^(::)?\\s*(sqlx|tokio|pwf_application|pwf_infra)(\\s*::\\s*.*|\\s+as\\s+.*)?$"
  std-effect-tree:
    all:
      - any:
          - kind: scoped_identifier
          - kind: scoped_type_identifier
          - kind: scoped_use_list
          - kind: use_wildcard
          - kind: use_as_clause
      - regex: "(?s)^(::)?\\s*std\\s*::\\s*((fs|process|net)(\\s*::\\s*.*)?|time\\s*::\\s*(SystemTime|Instant)(\\s*::\\s*.*)?)(\\s+as\\s+.*)?$"
  std-root-group:
    all:
      - kind: scoped_use_list
      - has:
          field: path
          regex: "(?s)^(::)?\\s*std$"
      - has:
          field: list
          all:
            - kind: use_list
            - has:
                stopBy: neighbor
                any:
                  - matches: std-root-member
                  - matches: std-time-member
                  - matches: std-time-member-group
                  - matches: wildcard-member
  std-root-member:
    all:
      - any:
          - kind: identifier
          - kind: scoped_identifier
          - kind: scoped_use_list
          - kind: use_wildcard
          - kind: use_as_clause
      - regex: "(?s)^(fs|process|net)(\\s*::\\s*.*|\\s+as\\s+.*)?$"
  std-time-member:
    all:
      - any:
          - kind: scoped_identifier
          - kind: scoped_use_list
          - kind: use_wildcard
          - kind: use_as_clause
      - regex: "(?s)^time\\s*::\\s*(\\*|(SystemTime|Instant)(\\s*::\\s*.*|\\s+as\\s+.*)?)$"
  std-time-member-group:
    all:
      - kind: scoped_use_list
      - has:
          field: path
          regex: "(?s)^time$"
      - has:
          field: list
          all:
            - kind: use_list
            - has:
                stopBy: neighbor
                any:
                  - matches: clock-member
                  - matches: wildcard-member
  std-time-group:
    all:
      - kind: scoped_use_list
      - has:
          field: path
          regex: "(?s)^(::)?\\s*std\\s*::\\s*time$"
      - has:
          field: list
          all:
            - kind: use_list
            - has:
                stopBy: neighbor
                any:
                  - matches: clock-member
                  - matches: wildcard-member
  clock-member:
    all:
      - any:
          - kind: identifier
          - kind: scoped_identifier
          - kind: scoped_use_list
          - kind: use_wildcard
          - kind: use_as_clause
      - regex: "(?s)^(SystemTime|Instant)(\\s*::\\s*.*|\\s+as\\s+.*)?$"
  wildcard-member:
    all:
      - kind: use_wildcard
      - regex: "(?s)^\\*$"
  chrono-effect-tree:
    all:
      - any:
          - kind: scoped_identifier
          - kind: scoped_type_identifier
          - kind: scoped_use_list
          - kind: use_wildcard
          - kind: use_as_clause
      - regex: "(?s)^(::)?\\s*chrono\\s*::\\s*(Local|Utc)(\\s*::\\s*.*)?(\\s+as\\s+.*)?$"
  chrono-root-group:
    all:
      - kind: scoped_use_list
      - has:
          field: path
          regex: "(?s)^(::)?\\s*chrono$"
      - has:
          field: list
          all:
            - kind: use_list
            - has:
                stopBy: neighbor
                any:
                  - all:
                      - any:
                          - kind: identifier
                          - kind: scoped_identifier
                          - kind: scoped_use_list
                          - kind: use_wildcard
                          - kind: use_as_clause
                      - regex: "(?s)^(Local|Utc)(\\s*::\\s*.*|\\s+as\\s+.*)?$"
                  - matches: wildcard-member
