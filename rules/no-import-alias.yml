# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rust_rule.json

id: no-import-alias
language: rust
severity: error
message: "Import alias `as` is banned: rename the item at its source, or import its parent module and qualify at the use site."
note: |
  An alias that reads better than the original means the original is misnamed --- fix it there, so
  every reader benefits instead of only this file. An alias needed to dodge a name clash means the
  use site should qualify through the parent module (`task::Action`) instead. `as _`, which
  imports a trait without binding a name, is allowed.
rule:
  all:
    - kind: use_as_clause
    - not:
        has:
          field: alias
          regex: "^_$"
