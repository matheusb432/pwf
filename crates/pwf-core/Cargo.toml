[package]
name = "pwf-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "pwf-core — domain-agnostic vault primitives (config, frontmatter, index) for pwf"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
regex = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
