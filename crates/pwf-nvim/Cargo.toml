[package]
name = "pwf-nvim"
version.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Neovim plugin child process for pwf"
autotests = false

[[test]]
name = "plugin"
path = "tests/plugin.rs"
test = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
pwf-client = { workspace = true }
pwf-models = { workspace = true }
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
