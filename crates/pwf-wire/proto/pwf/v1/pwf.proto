syntax = "proto3";

package pwf.v1;

service ProjectService {
  rpc AddProject(AddProjectRequest) returns (AddProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc PauseProject(PauseProjectRequest) returns (PauseProjectResponse);
  rpc RenameProject(RenameProjectRequest) returns (RenameProjectResponse);
  rpc ResumeProject(ResumeProjectRequest) returns (ResumeProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
}

service NoteService {
  rpc AddNote(AddNoteRequest) returns (AddNoteResponse);
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);
  rpc DeleteNote(stream DeleteNoteRequest) returns (stream DeleteNoteResponse);
}

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc DeleteTask(stream DeleteTaskRequest) returns (stream DeleteTaskResponse);
  rpc ReopenTask(stream ReopenTaskRequest) returns (stream ReopenTaskResponse);
}

service SessionService {
  rpc PlanSession(PlanSessionRequest) returns (PlanSessionResponse);
  rpc DispatchSession(stream DispatchSessionRequest) returns (stream DispatchSessionResponse);
}

enum ProjectStatusFilter {
  PROJECT_STATUS_FILTER_UNSPECIFIED = 0;
  PROJECT_STATUS_FILTER_ACTIVE_ONLY = 1;
  PROJECT_STATUS_FILTER_INCLUDING_PAUSED = 2;
}

message ProjectFields {
  string id = 1;
  string title = 2;
  string source_kind = 3;
  string source_value = 4;
  string tasks_kind = 5;
  string tasks_path = 6;
}

message ClearField {}

message StringFieldUpdate {
  oneof operation {
    string update = 1;
    ClearField clear = 2;
  }
}

message Project {
  string id = 1;
  string title = 2;
  string source_kind = 3;
  string source_value = 4;
  string tasks_kind = 5;
  string tasks_path = 6;
  string created_at = 7;
  bool is_paused = 8;
}

message AddProjectRequest { ProjectFields fields = 1; }

message AddProjectResponse {
  string id = 1;
  string title = 2;
  string source_kind = 3;
  string source_value = 4;
  string tasks_kind = 5;
  string tasks_path = 6;
  string created_at = 7;
  bool is_paused = 8;
}

message GetProjectRequest {
  string id = 1;
  ProjectStatusFilter status = 2;
}

message GetProjectResponse {
  string id = 1;
  string title = 2;
  string source_kind = 3;
  string source_value = 4;
  string tasks_kind = 5;
  string tasks_path = 6;
  string created_at = 7;
  bool is_paused = 8;
}

message ListProjectsRequest { ProjectStatusFilter status = 1; }
message ListProjectsResponse { repeated Project projects = 1; }
message PauseProjectRequest { string id = 1; }

message PauseProjectResponse {
  Project project = 1;
  bool changed = 2;
}

message RenameProjectRequest {
  string current_id = 1;
  ProjectFields fields = 2;
}

message RenameProjectResponse {
  string id = 1;
  string title = 2;
  string source_kind = 3;
  string source_value = 4;
  string tasks_kind = 5;
  string tasks_path = 6;
  string created_at = 7;
  bool is_paused = 8;
}

message ResumeProjectRequest { string id = 1; }

message ResumeProjectResponse {
  Project project = 1;
  bool changed = 2;
}

message UpdateProjectRequest {
  string id = 1;
  StringFieldUpdate source_value = 2;
}

message UpdateProjectResponse {}

message AddNoteRequest {
  string project_selector = 1;
  string title = 2;
  string content = 3;
  optional string why = 4;
  optional string domain = 5;
  repeated string tags = 6;
  repeated string sources = 7;
  optional string verified = 8;
  optional string date = 9;
}

enum NoteListLimitKind {
  NOTE_LIST_LIMIT_KIND_UNSPECIFIED = 0;
  NOTE_LIST_LIMIT_KIND_DEFAULT = 1;
  NOTE_LIST_LIMIT_KIND_UNLIMITED = 2;
  NOTE_LIST_LIMIT_KIND_AT_MOST = 3;
}

message ListNotesRequest {
  string project_selector = 1;
  NoteListLimitKind limit_kind = 2;
  uint64 limit = 3;
}

message UpdateNoteRequest {
  string project_selector = 1;
  string selector = 2;
  optional string title = 3;
  optional string content = 4;
  StringFieldUpdate why = 5;
  StringFieldUpdate domain = 6;
  StringCollectionEdit tags = 7;
  StringCollectionEdit sources = 8;
  StringFieldUpdate verified = 9;
}

message AddNoteResponse {
  string id = 1;
  string title = 2;
  string project = 3;
}

message ListedNote {
  string id = 1;
  string title = 2;
}

message ListNotesResponse {
  string project = 1;
  repeated ListedNote notes = 2;
  uint64 hidden = 3;
}

message UpdateNoteResponse {
  string id = 1;
  string title = 2;
  string project = 3;
}

message DeleteNoteStart {
  string project_selector = 1;
  string selector = 2;
}

message DeleteNoteConfirmation {
  string note_id = 1;
  string project = 2;
  string title = 3;
}

message DeletedNote {
  string id = 1;
  string project = 2;
  string title = 3;
}

message AbortedNoteOperation { string id = 1; }

message DeleteNoteResult {
  oneof outcome {
    DeletedNote deleted = 1;
    AbortedNoteOperation aborted = 2;
  }
}

message DeleteNoteRequest {
  oneof value {
    DeleteNoteStart start = 1;
    ConfirmationDecision decision = 2;
  }
}

message DeleteNoteResponse {
  oneof value {
    DeleteNoteConfirmation preflight = 1;
    DeleteNoteResult result = 2;
  }
}

enum TaskLane {
  TASK_LANE_UNSPECIFIED = 0;
  TASK_LANE_GOAL = 1;
  TASK_LANE_CONTEXT = 2;
  TASK_LANE_CONSTRAINT = 3;
  TASK_LANE_DONE_WHEN = 4;
}

message TaskLanes {
  repeated string goals = 1;
  repeated string context = 2;
  repeated string constraints = 3;
  repeated string done_when = 4;
}

message StructuredTaskPrompt {
  string title = 1;
  TaskLanes lanes = 2;
}

enum IndexSection {
  INDEX_SECTION_UNSPECIFIED = 0;
  INDEX_SECTION_GENERAL = 1;
  INDEX_SECTION_HUMAN = 2;
}

enum EffortTier {
  EFFORT_TIER_UNSPECIFIED = 0;
  EFFORT_TIER_LOW = 1;
  EFFORT_TIER_MEDIUM = 2;
  EFFORT_TIER_HIGH = 3;
  EFFORT_TIER_HIGHEST = 4;
}

enum PriorityTier {
  PRIORITY_TIER_UNSPECIFIED = 0;
  PRIORITY_TIER_LOW = 1;
  PRIORITY_TIER_MEDIUM = 2;
  PRIORITY_TIER_HIGH = 3;
  PRIORITY_TIER_HIGHEST = 4;
}

message CreateTaskRequest {
  string project_selector = 1;
  oneof prompt {
    string shorthand = 2;
    StructuredTaskPrompt structured = 3;
  }
  IndexSection index_section = 4;
  repeated string blocked_by = 5;
  optional EffortTier effort = 6;
  repeated string tags = 7;
  optional PriorityTier priority = 8;
}

message CancelTaskRequest {
  string id = 1;
  string report = 2;
  repeated string commits = 3;
  bool review = 4;
}

message CompleteTaskRequest {
  string id = 1;
  optional string report = 2;
  repeated string commits = 3;
  bool review = 4;
}

message StringValues { repeated string values = 1; }

message StringCollectionEdit {
  oneof operation {
    StringValues append = 1;
    StringValues replace = 2;
    ClearField clear = 3;
  }
}

message EffortEdit {
  oneof operation {
    EffortTier set = 1;
    ClearField clear = 2;
  }
}

message PriorityEdit {
  oneof operation {
    PriorityTier set = 1;
    ClearField clear = 2;
  }
}

message StructuredTaskEdit {
  optional string title = 1;
  TaskLanes additions = 2;
  repeated TaskLane removals = 3;
}

message AppendTaskPrompt {
  optional string title = 1;
  string prompt = 2;
}

message TaskContentEdit {
  oneof content {
    StructuredTaskEdit structured = 1;
    AppendTaskPrompt append = 2;
    string replace = 3;
  }
}

message UpdateTaskRequest {
  string id = 1;
  TaskContentEdit content = 2;
  StringCollectionEdit blocked_by = 3;
  EffortEdit effort = 4;
  StringCollectionEdit tags = 5;
  PriorityEdit priority = 6;
}

enum TaskReadFormat {
  TASK_READ_FORMAT_UNSPECIFIED = 0;
  TASK_READ_FORMAT_MARKDOWN = 1;
  TASK_READ_FORMAT_PATH = 2;
  TASK_READ_FORMAT_DATA = 3;
}

message GetTaskRequest {
  string id = 1;
  TaskReadFormat output = 2;
}

enum ListScope {
  LIST_SCOPE_UNSPECIFIED = 0;
  LIST_SCOPE_DEFAULT = 1;
  LIST_SCOPE_HUMAN = 2;
  LIST_SCOPE_FUTURE = 3;
  LIST_SCOPE_ALL = 4;
}

enum ListDetail {
  LIST_DETAIL_UNSPECIFIED = 0;
  LIST_DETAIL_SUMMARY = 1;
  LIST_DETAIL_DETAILED = 2;
}

enum TaskStatusFilter {
  TASK_STATUS_FILTER_UNSPECIFIED = 0;
  TASK_STATUS_FILTER_ACTIVE = 1;
  TASK_STATUS_FILTER_DONE = 2;
  TASK_STATUS_FILTER_CANCELLED = 3;
  TASK_STATUS_FILTER_ALL = 4;
}

enum OrderField {
  ORDER_FIELD_UNSPECIFIED = 0;
  ORDER_FIELD_CREATED = 1;
  ORDER_FIELD_ID = 2;
  ORDER_FIELD_PROJECT_ID = 3;
}

enum OrderDirection {
  ORDER_DIRECTION_UNSPECIFIED = 0;
  ORDER_DIRECTION_ASC = 1;
  ORDER_DIRECTION_DESC = 2;
}

message OrderSpec {
  OrderField field = 1;
  OrderDirection direction = 2;
}

message ListTasksRequest {
  optional string project_selector = 1;
  ListScope scope = 2;
  optional uint64 number = 3;
  optional EffortTier effort = 4;
  repeated string tags = 5;
  OrderSpec order = 6;
  optional TaskStatusFilter status = 7;
  ListDetail detail = 8;
  optional PriorityTier priority = 9;
}

message DeleteTaskStart { string id = 1; }
message ReopenTaskStart { string id = 1; }

message CreatedTask {
  string id = 1;
  string project = 2;
  string title = 3;
  string note_path = 4;
  optional string created_section = 5;
}

message CreateTaskResponse { CreatedTask task = 1; }

message CreateTaskFailureDetails {
  string project = 1;
  optional string created_section = 2;
}

message UpdatedTask {
  string id = 1;
  string project = 2;
  string title = 3;
}

message UpdateTaskResponse { UpdatedTask task = 1; }

message ClosedTask {
  string id = 1;
  string project = 2;
  string title = 3;
  repeated string evicted_ids = 4;
  optional string futuro_renamed_project = 5;
  CreatedTask review_task = 6;
}

message CancelTaskResponse { ClosedTask task = 1; }

message CompleteTaskResponse { ClosedTask task = 1; }

message ReopenedTask {
  string id = 1;
  string project = 2;
}

message AlreadyActiveTask {
  string id = 1;
  string project = 2;
}

message AbortedTaskOperation { string id = 1; }

message ReopenTaskResult {
  oneof outcome {
    ReopenedTask reopened = 1;
    AlreadyActiveTask already_active = 2;
    AbortedTaskOperation aborted = 3;
  }
}

message DeletedTask {
  string id = 1;
  string project = 2;
  string title = 3;
  string deleted_path = 4;
  optional string unlinked = 5;
}

message DeleteTaskResult {
  oneof outcome {
    DeletedTask deleted = 1;
    AbortedTaskOperation aborted = 2;
  }
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_ACTIVE = 1;
  TASK_STATUS_DONE = 2;
  TASK_STATUS_CANCELLED = 3;
}

message TaskData {
  string id = 1;
  string project = 2;
  string title = 3;
  TaskStatus status = 4;
  optional string created = 5;
  optional string completed = 6;
  optional string commits = 7;
  repeated string tags = 8;
  optional EffortTier effort = 9;
  repeated string blocked_by = 10;
  optional string section = 11;
  string prompt = 12;
  optional PriorityTier priority = 13;
}

message GetTaskResponse {
  oneof value {
    string markdown = 1;
    string path = 2;
    TaskData data = 3;
  }
}

enum ListLayout {
  LIST_LAYOUT_UNSPECIFIED = 0;
  LIST_LAYOUT_FLAT = 1;
  LIST_LAYOUT_BY_SECTION = 2;
}

enum BlockedByResolutionKind {
  BLOCKED_BY_RESOLUTION_KIND_UNSPECIFIED = 0;
  BLOCKED_BY_RESOLUTION_KIND_FOUND = 1;
  BLOCKED_BY_RESOLUTION_KIND_MISSING = 2;
  BLOCKED_BY_RESOLUTION_KIND_UNAVAILABLE = 3;
}

message BlockedByStatus {
  string id = 1;
  optional string title = 2;
  BlockedByResolutionKind resolution = 3;
  optional TaskStatus status = 4;
  optional string reason = 5;
}

message BlockedByIssue {
  string path = 1;
  string raw = 2;
  string reason = 3;
}

enum TaskIssueKind {
  TASK_ISSUE_KIND_UNSPECIFIED = 0;
  TASK_ISSUE_KIND_MISSING_NOTE = 1;
  TASK_ISSUE_KIND_PLACEHOLDER_PROMPT = 2;
}

message TaskIssue {
  TaskIssueKind kind = 1;
  optional string path = 2;
}

message TaskLocation {
  string index_path = 1;
  uint64 line = 2;
}

message TaskView {
  string id = 1;
  string project = 2;
  TaskStatus status = 3;
  string heading = 4;
  string prompt = 5;
  string project_path = 6;
  TaskLocation location = 7;
  repeated TaskIssue launch_issues = 8;
  optional string section = 9;
  repeated string blocked_by = 10;
  repeated BlockedByStatus blocked_by_statuses = 11;
  repeated BlockedByIssue blocked_by_issues = 12;
  optional EffortTier effort = 13;
  optional string raw_tags = 14;
  optional string created = 15;
  optional PriorityTier priority = 16;
}

message ListTasksResponse {
  repeated TaskView tasks = 1;
  uint64 hidden = 2;
  optional string project = 3;
  optional string project_task_path = 4;
  TaskStatusFilter status_filter = 5;
  ListLayout layout = 6;
  ListDetail detail = 7;
}

message DeleteTaskConfirmation {
  string task_id = 1;
  string project = 2;
  string title = 3;
  TaskStatus status = 4;
  string note_path = 5;
}

message ReopenTaskConfirmation {
  string task_id = 1;
  string project = 2;
  optional string completion_date = 3;
  optional string commits = 4;
  optional string report = 5;
}

message ConfirmationDecision { bool confirmed = 1; }

message DeleteTaskRequest {
  oneof value {
    DeleteTaskStart start = 1;
    ConfirmationDecision decision = 2;
  }
}

message DeleteTaskResponse {
  oneof value {
    DeleteTaskConfirmation preflight = 1;
    DeleteTaskResult result = 2;
  }
}

message ReopenTaskRequest {
  oneof value {
    ReopenTaskStart start = 1;
    ConfirmationDecision decision = 2;
  }
}

message ReopenTaskResponse {
  oneof value {
    ReopenTaskConfirmation preflight = 1;
    ReopenTaskResult result = 2;
  }
}

enum Agent {
  AGENT_UNSPECIFIED = 0;
  AGENT_CLAUDE = 1;
  AGENT_CODEX = 2;
}

enum DispatchMode {
  DISPATCH_MODE_UNSPECIFIED = 0;
  DISPATCH_MODE_INLINE = 1;
  DISPATCH_MODE_MULTIPLEXER = 2;
}

enum SessionEffort {
  SESSION_EFFORT_UNSPECIFIED = 0;
  SESSION_EFFORT_LOW = 1;
  SESSION_EFFORT_MEDIUM = 2;
  SESSION_EFFORT_HIGH = 3;
  SESSION_EFFORT_XHIGH = 4;
  SESSION_EFFORT_MAX = 5;
}

enum PlanSessionIntent {
  PLAN_SESSION_INTENT_UNSPECIFIED = 0;
  PLAN_SESSION_INTENT_DRY_RUN = 1;
  PLAN_SESSION_INTENT_DISPATCH = 2;
}

message LaunchDirectives {
  bool worktree = 1;
  bool autonomous = 2;
}

message PlanSessionRequest {
  repeated string task_ids = 1;
  PlanSessionIntent intent = 2;
  optional string pushed_prompt = 3;
  DispatchMode mode = 4;
  LaunchDirectives directives = 5;
  Agent agent = 6;
  optional string model_override = 7;
  SessionEffort effort = 8;
  map<string, string> environment = 9;
}

message AgentLaunch {
  Agent agent = 1;
  repeated string task_ids = 2;
  string title = 3;
  string project_path = 4;
  string prompt = 5;
  optional string model = 6;
  SessionEffort effort = 7;
  string session_name = 8;
}

message SessionPlan {
  AgentLaunch launch = 1;
  DispatchMode mode = 2;
}

enum AgentAvailability {
  AGENT_AVAILABILITY_UNSPECIFIED = 0;
  AGENT_AVAILABILITY_MISSING = 1;
  AGENT_AVAILABILITY_AVAILABLE = 2;
}

message AgentProbe {
  Agent agent = 1;
  AgentAvailability availability = 2;
}

message SessionWarning {
  oneof value {
    BlockedByStatus blocked_by = 1;
    BlockedByIssue blocked_by_metadata = 2;
  }
}

message PlanSessionResponse {
  SessionPlan plan = 1;
  repeated string argv = 2;
  AgentProbe probe = 3;
  repeated SessionWarning warnings = 4;
}

message DispatchConfirmation {
  repeated string task_ids = 1;
  string title = 2;
  optional string created = 3;
  DispatchMode mode = 4;
  Agent agent = 5;
  LaunchDirectives directives = 6;
  bool has_pushed_prompt = 7;
  optional string model = 8;
  SessionEffort effort = 9;
  string session_name = 10;
}

message SessionDispatchPreflight {
  DispatchConfirmation confirmation = 1;
  AgentProbe probe = 2;
  repeated SessionWarning warnings = 3;
}

message InlineLaunch {
  repeated string task_ids = 1;
  repeated string argv = 2;
  string working_directory = 3;
  string session_name = 4;
}

message WindowOpened {
  repeated string task_ids = 1;
  string session = 2;
  Agent agent = 3;
  string project_path = 4;
  string window = 5;
}

enum DispatchSessionOutcome {
  DISPATCH_SESSION_OUTCOME_UNSPECIFIED = 0;
  DISPATCH_SESSION_OUTCOME_ABORTED = 1;
  DISPATCH_SESSION_OUTCOME_INLINE_LAUNCH = 2;
  DISPATCH_SESSION_OUTCOME_WINDOW_OPENED = 3;
}

message DispatchedSession {
  DispatchSessionOutcome outcome = 1;
  repeated string task_ids = 2;
  InlineLaunch inline_launch = 3;
  WindowOpened window_opened = 4;
  string session_name = 5;
}

message DispatchSessionRequest {
  oneof value {
    PlanSessionRequest start = 1;
    ConfirmationDecision decision = 2;
  }
}

message DispatchSessionResponse {
  oneof value {
    SessionDispatchPreflight preflight = 1;
    DispatchedSession result = 2;
  }
}
