[package]
name = "pwf-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manages tasks and project notes across configured projects."
autotests = false

[[bin]]
name = "pwf"
path = "src/main.rs"

[lib]
name = "pwf_cli"
path = "src/lib.rs"

[[test]]
name = "binary"
path = "tests/binary.rs"
test = false

[[test]]
name = "e2e"
path = "tests/e2e.rs"
test = false

[[bench]]
name = "dag_render"
harness = false

[dependencies]
anyhow = { workspace = true }
pwf-client = { workspace = true }
pwf-models = { workspace = true }
clap = { workspace = true }
clap-cargo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dialoguer = { workspace = true }
lazy-regex = { workspace = true }
mermaid-text = { workspace = true }
anstyle = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
walkdir = { workspace = true }

[dev-dependencies]
allocation-counter = { workspace = true }
assert_cmd = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
expectrl = { workspace = true }

[lints]
workspace = true
