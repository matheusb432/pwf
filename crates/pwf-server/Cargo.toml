[package]
description = "Resident local gRPC server library for pwf"
name = "pwf-server"
version.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bench]]
name = "list_tasks_rpc"
harness = false

[dependencies]
anyhow = { workspace = true }
directories = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
pwf-application = { workspace = true }
pwf-infra = { workspace = true }
pwf-migrator = { workspace = true }
pwf-local-transport = { workspace = true }
pwf-models = { workspace = true }
pwf-wire = { workspace = true }
rolling-file = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["router", "transport"] }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
pwf-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
