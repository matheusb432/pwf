[package]
name = "pwf-tui"
version.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Keyboard-driven task and note frontend for pwf"

[dependencies]
aho-corasick = "1.1.4"
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = { workspace = true }
pwf-client = { workspace = true }
pwf-models = { workspace = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-textarea = { version = "0.9.2", default-features = false, features = ["crossterm"] }
shell-words = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "process"] }
tonic = { workspace = true }

