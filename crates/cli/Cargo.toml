[package]
name = "pwf"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manages pending work, handoffs, and project notes across configured repositories."

[[bin]]
name = "pwf"
path = "src/main.rs"

[lib]
name = "pwf"
path = "src/lib.rs"

# Binary-e2e suites, excluded from the default `cargo test` so `just test` stays in-process.
# `test = false` only drops them from the default set; `just test --e2e` and
# `cargo test --test <name>` still select them explicitly.
[[test]]
name = "cli_e2e"
path = "tests/cli_e2e.rs"
test = false

[[test]]
name = "help_cli"
path = "tests/help_cli.rs"
test = false

[[test]]
name = "project_cli"
path = "tests/project_cli.rs"
test = false

[dependencies]
anstream = { workspace = true }
pwf-application = { workspace = true }
pwf-core = { workspace = true }
pwf-domain = { workspace = true }
pwf-infra = { workspace = true }
pwf-note = { workspace = true }
clap = { workspace = true }
clap-cargo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
nutype = { workspace = true }
anstyle = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
walkdir = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
console = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
expectrl = { workspace = true }

[lints]
workspace = true
