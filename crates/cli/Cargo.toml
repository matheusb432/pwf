[package]
name = "pwf"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manages pending work and project notes across configured repositories."

[[bin]]
name = "pwf"
path = "src/main.rs"

[lib]
name = "pwf"
path = "src/lib.rs"

[dependencies]
pwf_application = { workspace = true }
pwf_models = { workspace = true }
pwf_infra = { workspace = true }
clap = { workspace = true }
clap-cargo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
directories = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
anstyle = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
walkdir = { workspace = true }

[lints]
workspace = true
