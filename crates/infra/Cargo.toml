[package]
name = "pwf-infra"
version = "4.1.0"
edition = "2024"
publish = false

[dependencies]
pwf-application = { path = "../application" }
pwf-domain = { path = "../domain" }
pwf-core = { path = "../pwf-core" }
prompt-lanes = { path = "../../shared/prompt-lanes" }
regex = "1"
thiserror = "2.0.18"
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
