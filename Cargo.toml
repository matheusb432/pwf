[workspace]
members = ["crates/*", "shared/pwf-marker-sections", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.1"
rust-version = "1.98.1"
repository = "https://github.com/matheusb432/pwf"
readme = "README.md"
edition = "2024"
license = "MIT"
publish = ["crates-io"]

[workspace.dependencies]
anyhow = "1"
allocation-counter = "0.8.1"
anstyle = "1"
base64 = "0.22.1"
blake3 = "1.8.7"
askama = { version = "0.16.0", default-features = false, features = ["derive", "std"] }
atomic-write-file = "0.3.1"
assert_cmd = "2"
cargo_metadata = "0.23.1"
hyper-util = { version = "0.1.20", default-features = false }
jiff = "0.2.35"
clap = { version = "4", features = ["derive"] }
clap-cargo = "0.18.3"
cqrsy = "0.11.0"
criterion = "0.8.2"
directories = "6.0.0"
dialoguer = { version = "0.12.0", default-features = false }
expectrl = "0.9.0"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }
lazy-regex = "3.6.1"
libc = "0.2.186"
mermaid-text = "0.57.0"
nutype = "0.7.0"
percent-encoding = "2.3.2"
process-wrap = { version = "9.1.0", default-features = false, features = [
    "job-object",
    "process-group",
    "std",
] }
prost = "0.14.4"
pwf-marker-sections = { path = "shared/pwf-marker-sections", version = "=0.1.1" }
pwf-application = { path = "crates/pwf-application", version = "=0.1.1" }
pwf-cli = { path = "crates/pwf-cli", version = "=0.1.1" }
pwf-server = { path = "crates/pwf-server", version = "=0.1.1" }
pwf-client = { path = "crates/pwf-client", version = "=0.1.1" }
pwf-infra = { path = "crates/pwf-infra", version = "=0.1.1" }
pwf-migrator = { path = "crates/pwf-migrator", version = "=0.1.1" }
pwf-local-transport = { path = "crates/pwf-local-transport", version = "=0.1.1" }
pwf-models = { path = "crates/pwf-models", version = "=0.1.1" }
pwf-wire = { path = "crates/pwf-wire", version = "=0.1.1" }
rolling-file = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "macros",
    "migrate",
    "sqlx-toml",
] }
tempfile = "3"
thiserror = "2.0.18"
toml = "1.1.2"
tokio = "1"
tokio-stream = "0.1.18"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.0", default-features = false, features = ["trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
] }
walkdir = "2"
windows-sys = "0.61.2"
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
disallowed_methods = "deny"
collection_is_never_read = "warn"
missing_errors_doc = "allow"
struct_field_names = "allow"

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

[profile.release]
strip = true
