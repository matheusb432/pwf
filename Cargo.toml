[workspace]
members = ["crates/*", "e2e", "shared/prompt-lanes", "xtask"]
default-members = ["crates/pwf-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
anyhow = "1"
anstyle = "1"
askama = { version = "0.16.0", default-features = false, features = ["derive", "std"] }
assert_cmd = "2"
bon = "3.9.3"
cargo_metadata = "0.23.1"
jiff = "0.2.35"
clap = { version = "4", features = ["derive"] }
clap-cargo = "0.18.3"
command-group = "5.0.1"
cqrsy = { git = "ssh://git@github.com/matheusb432/cqrsy.git", tag = "v0.10.0" }
directories = "6.0.0"
expectrl = "0.9.0"
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }
indicatif = { version = "0.18.6", default-features = false }
libc = "0.2.186"
nutype = "0.7.0"
percent-encoding = "2.3.2"
process-wrap = { version = "9.1.0", default-features = false, features = [
    "job-object",
    "process-group",
    "std",
] }
prompt-lanes = { path = "shared/prompt-lanes" }
pwf-application = { path = "crates/pwf-application" }
pwf-models = { path = "crates/pwf-models" }
pwf-infra = { path = "crates/pwf-infra" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "macros",
    "migrate",
    "sqlx-toml",
] }
tempfile = "3"
thiserror = "2.0.18"
toml = "1.1.2"
tokio = "1"
walkdir = "2"
xtk_test = { git = "ssh://git@github.com/matheusb432/xtk-test.git", tag = "v0.4.0" }

# Avoid tweaking, prefer fixing the lints.
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
disallowed_methods = "deny"
cognitive_complexity = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
strip = true
