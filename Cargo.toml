[workspace]
members = ["crates/*", "shared/prompt-lanes", "xtask"]
default-members = ["crates/pwf-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1"
allocation-counter = "0.8.1"
anstyle = "1"
base64 = "0.22.1"
askama = { version = "0.16.0", default-features = false, features = ["derive", "std"] }
assert_cmd = "2"
cargo_metadata = "0.23.1"
jiff = "0.2.35"
clap = { version = "4", features = ["derive"] }
clap-cargo = "0.18.3"
command-group = "5.0.1"
cqrsy = "0.11.0"
criterion = "0.8.2"
directories = "6.0.0"
dialoguer = { version = "0.12.0", default-features = false }
expectrl = "0.9.0"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }
indicatif = { version = "0.18.6", default-features = false }
lazy-regex = "3.6.1"
libc = "0.2.186"
nutype = "0.7.0"
percent-encoding = "2.3.2"
process-wrap = { version = "9.1.0", default-features = false, features = [
    "job-object",
    "process-group",
    "std",
] }
prost = "0.14.4"
prompt-lanes = { path = "shared/prompt-lanes" }
pwf-application = { path = "crates/pwf-application" }
pwf-client = { path = "crates/pwf-client" }
pwf-infra = { path = "crates/pwf-infra" }
pwf-local-auth = { path = "crates/pwf-local-auth" }
pwf-models = { path = "crates/pwf-models" }
pwf-wire = { path = "crates/pwf-wire" }
rolling-file = "0.2.0"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "macros",
    "migrate",
    "sqlx-toml",
] }
tempfile = "3"
thiserror = "2.0.18"
toml = "1.1.2"
tokio = "1"
tokio-stream = "0.1.18"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
tower-http = { version = "0.7.0", default-features = false, features = ["trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
] }
subtle = { version = "2.6.1", default-features = false }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
xtk-test = { version = "0.10", features = ["json"] }
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
disallowed_methods = "deny"
cognitive_complexity = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

[profile.release]
strip = true
