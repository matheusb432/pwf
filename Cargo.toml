[workspace]
members = ["crates/*", "shared/prompt-lanes", "xtask"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
anstyle = "1"
anstream = "1"
assert_cmd = "2"
cargo_metadata = "0.23.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap-cargo = "0.18.3"
console = { version = "0.16.4", default-features = false, features = [
    "ansi-parsing",
    "alloc",
] }
cqrsy = { git = "ssh://git@github.com/matheusb432/cqrsy.git", tag = "v0.10.0" }
directories = "6.0.0"
expectrl = "0.9.0"
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }
nutype = { version = "0.7.0", features = ["serde", "regex"] }
percent-encoding = "2.3.2"
predicates = "3"
process-wrap = { version = "9.1.0", default-features = false, features = [
    "job-object",
    "process-group",
    "std",
] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
prompt-lanes = { path = "shared/prompt-lanes" }
pwf-application = { path = "crates/application" }
pwf-domain = { path = "crates/domain" }
pwf-infra = { path = "crates/infra" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "sqlx-toml",
] }
syn = { version = "2.0.118", default-features = false, features = [
    "full",
    "parsing",
    "visit",
] }
tempfile = "3"
thiserror = "2.0.18"
toml = "1.1.2"
tokio = "1"
walkdir = "2"

# Avoid tweaking, prefer fixing the lints.
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
disallowed_methods = "deny"
cognitive_complexity = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
strip = true
