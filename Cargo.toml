[workspace]
members = ["crates/*", "shared/prompt-lanes", "xtask"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
assert_cmd = "2"
cargo_metadata = "0.23.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
console = { version = "0.16.4", default-features = false, features = [
    "ansi-parsing",
    "alloc",
] }
cqrsy = { git = "ssh://git@github.com/matheusb432/cqrsy.git", tag = "v0.10.0" }
expectrl = "0.9.0"
nutype = { version = "0.7.0", features = ["serde", "regex"] }
predicates = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2.0.18"
toml = "1.1.2"

# Avoid tweaking, prefer fixing the lints.
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
disallowed_methods = "deny"
cognitive_complexity = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
strip = true
