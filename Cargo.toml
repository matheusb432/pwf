[workspace]
members = ["crates/*", "shared/prompt-lanes", "xtask"]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
assert_cmd = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cqrsy = { git = "ssh://git@github.com/matheusb432/cqrsy.git", tag = "v0.9.0" }
nutype = { version = "0.7.0", features = ["serde", "regex"] }
predicates = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2.0.18"

# Real delta over clippy defaults is `pedantic = warn`; group levels sit low so per-lint overrides win.
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
# Stays fatal despite `all = warn`.
correctness = { level = "deny", priority = -1 }
# Keeps clippy.toml's disallowed methods hard errors in local runs, not just under `-D warnings`.
disallowed_methods = "deny"
# Nursery opt-ins (the group itself stays off): a branching-weight gate — threshold lives in
# clippy.toml's `cognitive-complexity-threshold` — plus two duplicate/dead-logic catchers.
cognitive_complexity = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
# Heuristic and over-flags; real "ignored value" safety is rustc's `unused_must_use`.
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
strip = true
