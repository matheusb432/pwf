id: no-private-logic-effects
valid:
  - |
    use std::{collections::BTreeMap, fmt};
    use thiserror::Error;

    fn select(values: &[String]) -> Option<String> {
        values.first().cloned()
    }
  - |
    use std::time::Duration;

    fn timeout_limit() -> Duration {
        Duration::from_secs(30)
    }
