# pwf dev-environment readiness. Engine: the shared `doctor-rs` binary (CODE DOC).
# Run `just doctor`. Read-only — it never installs; provisioning owns that.

[[tool]]
name = "cargo"
min = "1.75"
hint = "install rust via rustup: https://rustup.rs"

[[tool]]
name = "just"
hint = "cargo install just"
