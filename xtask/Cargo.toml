[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
# Embedded dev-automation crate (ADR-0010): never published, never installed. Built on demand
# via `cargo run -p xtask -- <verb>` from the pwf justfile. All justfile-automation *logic* for
# this repo lives here in Rust — recipe bodies stay one-line forwarders.
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cargo_metadata = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
