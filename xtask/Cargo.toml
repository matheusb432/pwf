[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
# Embedded dev-automation crate: never published, never installed. The justfile forwards each
# recipe to `cargo run -p xtask -- <verb>`, so all automation logic lives here in Rust.
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true }
clap-cargo = { workspace = true }
percent-encoding = { workspace = true }
process-wrap = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
